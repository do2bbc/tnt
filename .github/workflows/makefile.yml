name: CMake CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gettext libncurses-dev

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNT_WARNINGS_AS_ERRORS=ON -DCMAKE_C_FLAGS=-D_FORTIFY_SOURCE=3

    - name: Build
      run: cmake --build build --parallel 2

    - name: Test
      run: ctest --test-dir build --output-on-failure --parallel 2

    - name: Build source archive
      run: cmake --build build --target package_source

    - name: Build without serial, sound or translations
      run: |
        cmake -S . -B build-minimal -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DTNT_SERIAL=OFF -DTNT_SOUND=OFF -DTNT_NLS=OFF
        cmake --build build-minimal --parallel 2
        ctest --test-dir build-minimal --output-on-failure --parallel 2

  build-armhf:

    name: build (armhf)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm

    - name: Build in 32-bit ARM container
      run: |
        docker run --rm -i --platform linux/arm/v7 \
          -v "$PWD:/work" \
          -w /work \
          arm32v7/debian:bookworm-slim \
          sh -e <<'BUILD'
            apt-get update
            apt-get install -y build-essential cmake ninja-build gettext libncurses-dev
            useradd -m builder
            mkdir /tmp/tnt
            tar --exclude=.git -C /work -cf - . | tar -C /tmp/tnt -xf -
            chown -R builder:builder /tmp/tnt
            cd /tmp/tnt
            su builder -c 'cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DTNT_WARNINGS_AS_ERRORS=ON -DCMAKE_C_FLAGS=-D_FORTIFY_SOURCE=3 &&
              cmake --build build --parallel 2 &&
              ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build --output-on-failure &&
              cmake --build build --target package_source'
        BUILD
