name: Linux release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build gettext libncurses-dev dpkg-dev git ca-certificates python3 qemu-user gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross
          dpkg --add-architecture arm64
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends libncurses-dev:arm64 libncurses-dev:armhf
      - uses: actions/checkout@v6
      - name: Build and verify Debian package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh packaging/build-deb.sh "${{ matrix.arch }}" /tmp/packages
          python3 packaging/test-package.py /tmp/packages/*.deb "${{ matrix.arch }}"
          python3 packaging/test-package.py /tmp/packages/*.deb --preservation
      - uses: actions/upload-artifact@v6
        with:
          name: TNT-Debian12-${{ matrix.arch }}
          path: /tmp/packages/*.deb
          if-no-files-found: error
  rpm:
    runs-on: ubuntu-24.04
    container: registry.opensuse.org/opensuse/leap:16.0
    timeout-minutes: 20
    steps:
      - name: Install build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends gcc make cmake ninja gettext-tools ncurses-devel rpm-build git-core tar gzip xz python3
      - uses: actions/checkout@v6
      - name: Build and verify Leap 16 RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh packaging/build-rpm.sh /tmp/packages
          python3 packaging/test-package.py /tmp/packages/*.x86_64.rpm x86_64
          rpm -V tnt
          rpm -e tnt
          python3 packaging/test-package.py /tmp/packages/*.x86_64.rpm --preservation
      - uses: actions/upload-artifact@v6
        with:
          name: TNT-openSUSE-Leap16-x86_64
          path: |
            /tmp/packages/*.rpm
            /tmp/packages/*.tar.gz
          if-no-files-found: error
